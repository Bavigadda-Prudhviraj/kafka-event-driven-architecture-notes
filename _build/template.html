<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{PAGE_TITLE}}</title>
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
/* ==========================================================================
   Apache Kafka Documentation — shared design system
   ========================================================================== */
:root {
  --ink: #0b1220;
  --ink-2: #111a2e;
  --ink-3: #1c2740;
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f9fafc;
  --border: #e3e7ef;
  --text: #1d2433;
  --text-2: #3f4859;
  --muted: #6b7486;
  --accent: #ea580c;
  --accent-2: #f97316;
  --accent-soft: #fff4ec;
  --accent-text: #c2410c;
  --teal: #0f9d8f;
  --teal-soft: #e8f7f5;
  --blue: #2563eb;
  --blue-soft: #eef4ff;
  --violet: #7c3aed;
  --violet-soft: #f4efff;
  --red: #dc2626;
  --red-soft: #fef1f1;
  --amber: #d97706;
  --amber-soft: #fff8e6;
  --green: #16a34a;
  --green-soft: #ecfbf1;
  --code-bg: #0d1117;
  --code-border: #1f2a3c;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  --shadow-lg: 0 10px 34px rgba(16,24,40,.12);
  --sidebar-w: 292px;
  --toc-w: 236px;
  --topbar-h: 62px;
  --font: 'Inter', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 18px); }
body {
  margin: 0; font-family: var(--font); color: var(--text); background: var(--bg);
  font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }

/* ---------- Top bar ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 50;
  display: flex; align-items: center; gap: 14px; padding: 0 22px;
  background: rgba(11,18,32,.96); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,.06); color: #fff;
}
.brand { display: flex; align-items: center; gap: 11px; color: #fff; font-weight: 700; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand-logo { width: 34px; height: 34px; flex: none; }
.brand-text small { display: block; font-size: 11px; font-weight: 500; color: #9aa6bd; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.brand-text span { font-size: 16px; line-height: 1.2; }
.topbar .spacer { flex: 1; }
.topbar .author-chip {
  font-size: 13px; color: #c9d2e3; padding: 6px 12px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); white-space: nowrap;
}
.topbar .author-chip b { color: #fff; font-weight: 600; }
.topbar .home-btn { white-space: nowrap;
  font-size: 13px; font-weight: 600; color: #fff; padding: 7px 14px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.topbar .home-btn:hover { text-decoration: none; filter: brightness(1.08); }
.menu-btn {
  display: inline-grid; place-items: center; background: transparent; border: 1px solid rgba(255,255,255,.18); color: #fff;
  border-radius: 8px; width: 38px; height: 36px; cursor: pointer; font-size: 18px;
}

/* ---------- Sidebar ---------- */
.sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w); z-index: 40;
  background: var(--ink); color: #c9d2e3; overflow-y: auto; padding: 20px 14px 40px;
  border-right: 1px solid rgba(255,255,255,.05);
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: #26324b; border-radius: 8px; }
.side-search {
  width: 100%; padding: 9px 12px; margin-bottom: 16px; border-radius: 9px; font: inherit; font-size: 13.5px;
  background: var(--ink-3); color: #fff; border: 1px solid #2a3755; outline: none;
}
.side-search:focus { border-color: var(--accent); }
.side-home {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 9px; color: #fff;
  font-weight: 600; font-size: 14px; margin-bottom: 8px;
}
.side-home:hover { background: var(--ink-3); text-decoration: none; }
.side-group { margin-top: 16px; }
.side-group h4 {
  margin: 0 0 6px; padding: 0 12px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #7f8ba3; font-weight: 700;
}
.side-link {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 12px; border-radius: 8px;
  color: #c9d2e3; font-size: 13.8px; line-height: 1.4; border-left: 3px solid transparent;
}
.side-link:hover { background: var(--ink-3); color: #fff; text-decoration: none; }
.side-link .num { font-family: var(--mono); font-size: 11.5px; color: #7f8ba3; min-width: 20px; }
.side-link.active { background: linear-gradient(90deg, rgba(234,88,12,.22), rgba(234,88,12,.04)); color: #fff; border-left-color: var(--accent); font-weight: 600; }
.side-link.active .num { color: var(--accent-2); }
.side-link.soon { opacity: .5; cursor: default; }
.side-link.soon:hover { background: none; color: #c9d2e3; }
.side-link.soon em { margin-left: auto; font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #7f8ba3; }
.side-foot { margin-top: 26px; padding: 14px 12px; border-top: 1px solid #1e2a42; font-size: 12px; color: #7f8ba3; }

/* ---------- Layout ---------- */
.layout { margin-left: var(--sidebar-w); padding-top: var(--topbar-h); display: flex; justify-content: center; }
.main { flex: 1; min-width: 0; max-width: 980px; padding: 34px 44px 60px; }
.toc {
  width: var(--toc-w); flex: none; position: sticky; top: calc(var(--topbar-h) + 26px);
  align-self: flex-start; max-height: calc(100vh - var(--topbar-h) - 50px); overflow-y: auto; padding: 8px 18px 20px 0;
}
.toc h5 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.toc a { display: block; font-size: 13px; color: var(--text-2); padding: 5px 0 5px 12px; border-left: 2px solid var(--border); line-height: 1.4; }
.toc a:hover { color: var(--accent-text); text-decoration: none; }
.toc a.active { color: var(--accent-text); border-left-color: var(--accent); font-weight: 600; }

/* ---------- Breadcrumb & hero ---------- */
.breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.breadcrumb a { color: var(--muted); }
.breadcrumb a:hover { color: var(--accent-text); }
.hero {
  position: relative; overflow: hidden; border-radius: 20px; padding: 34px 36px 30px; color: #fff;
  background:
    radial-gradient(1000px 300px at 110% -20%, rgba(249,115,22,.45), transparent 60%),
    radial-gradient(600px 260px at -10% 120%, rgba(15,157,143,.35), transparent 60%),
    linear-gradient(135deg, #0b1220 0%, #16223a 60%, #1b2a47 100%);
  box-shadow: var(--shadow-lg); margin-bottom: 30px;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 240px; height: 240px; opacity: .10;
  background-image: radial-gradient(#fff 1.5px, transparent 1.5px); background-size: 16px 16px;
}
.hero .chapter { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #ffd2b5; background: rgba(234,88,12,.18); border: 1px solid rgba(249,115,22,.4); padding: 5px 11px; border-radius: 999px; }
.hero h1 { margin: 14px 0 10px; font-size: 36px; line-height: 1.18; letter-spacing: -.02em; font-weight: 800; }
.hero p.lead { margin: 0; max-width: 720px; color: #cfd8e8; font-size: 16.5px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 20px; font-size: 13px; color: #aab5ca; }
.hero .meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero .meta b { color: #fff; font-weight: 600; }

/* ---------- Typography ---------- */
.main h2 {
  font-size: 26px; letter-spacing: -.015em; margin: 52px 0 14px; padding-top: 6px; line-height: 1.25;
  display: flex; align-items: center; gap: 12px;
}
.main h2 .sec-num {
  flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; font-size: 15px; font-weight: 800;
  color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 12px rgba(234,88,12,.3);
}
.main h3 { font-size: 19.5px; margin: 32px 0 10px; letter-spacing: -.01em; }
.main h4 { font-size: 16.5px; margin: 22px 0 8px; }
.main p { margin: 10px 0 14px; color: var(--text-2); }
.main ul, .main ol { padding-left: 24px; color: var(--text-2); }
.main li { margin: 5px 0; }
.main li::marker { color: var(--accent); font-weight: 700; }
.main strong { color: var(--text); }
code:not(pre code) {
  font-family: var(--mono); font-size: .86em; background: #f1f3f8; color: #b4380a; padding: 2px 7px; border-radius: 6px; border: 1px solid #e6e9f0;
}
hr.sep { border: 0; height: 1px; background: var(--border); margin: 40px 0; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); margin: 18px 0; }
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
.card-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16.5px; margin-bottom: 8px; color: var(--text); }
.grid { display: grid; gap: 16px; margin: 18px 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid .card { margin: 0; }
.feature { position: relative; padding-top: 20px; }
.feature .icon {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; font-size: 18px; margin-bottom: 10px;
  background: var(--accent-soft); color: var(--accent-text);
}
.feature h4 { margin: 0 0 6px; font-size: 16px; }
.feature p { margin: 0; font-size: 14.5px; }
.feature.teal .icon { background: var(--teal-soft); color: var(--teal); }
.feature.blue .icon { background: var(--blue-soft); color: var(--blue); }
.feature.violet .icon { background: var(--violet-soft); color: var(--violet); }
.feature.red .icon { background: var(--red-soft); color: var(--red); }
.feature.green .icon { background: var(--green-soft); color: var(--green); }
.feature.amber .icon { background: var(--amber-soft); color: var(--amber); }
.feature .tag { position: absolute; top: 16px; right: 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* numbered problem / point list */
.points { list-style: none; padding: 0 !important; margin: 18px 0; counter-reset: pt; display: grid; gap: 12px; }
.points > li {
  counter-increment: pt; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 18px 14px 62px; margin: 0; box-shadow: var(--shadow);
}
.points > li::before {
  content: counter(pt); position: absolute; left: 16px; top: 14px; width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--accent-text); background: var(--accent-soft);
}
.points > li > b:first-child { display: block; color: var(--text); font-size: 15.5px; margin-bottom: 2px; }
.points > li p { margin: 4px 0; }
.points.red > li::before { color: var(--red); background: var(--red-soft); }
.points.green > li::before { color: var(--green); background: var(--green-soft); }
.points.amber > li::before { color: var(--amber); background: var(--amber-soft); }
.points.blue > li::before { color: var(--blue); background: var(--blue-soft); }

/* ---------- Callouts ---------- */
.callout { display: flex; gap: 14px; border-radius: 12px; padding: 15px 18px; margin: 18px 0; border: 1px solid; font-size: 15px; }
.callout .ci { flex: none; font-size: 18px; line-height: 1.5; }
.callout > div { flex: 1; min-width: 0; } /* lets code blocks inside a callout scroll instead of widening the page */
.callout > div > :first-child { margin-top: 0; }
.callout > div > :last-child { margin-bottom: 0; }
.callout p { margin: 4px 0; color: inherit; }
.callout b.ct { display: block; margin-bottom: 2px; }
.callout.note { background: var(--blue-soft); border-color: #cfdcff; color: #1e3a8a; }
.callout.tip { background: var(--green-soft); border-color: #c4eed3; color: #14532d; }
.callout.warn { background: var(--amber-soft); border-color: #f7e0a8; color: #78350f; }
.callout.danger { background: var(--red-soft); border-color: #f9cccc; color: #7f1d1d; }
.callout.key { background: var(--accent-soft); border-color: #fed7bf; color: #7c2d12; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 18px 0; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
thead th { background: var(--ink-2); color: #fff; text-align: left; font-weight: 600; padding: 12px 16px; font-size: 13.5px; letter-spacing: .02em; }
tbody td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
tbody tr:nth-child(even) td { background: var(--surface-2); }
tbody td:first-child { font-weight: 600; color: var(--text); }

/* ---------- Diagrams ---------- */
.diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin: 22px 0; overflow: hidden; }
.diagram-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.diagram-head .dt { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.diagram-head .dt::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.diagram-head .db { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.diagram-body { padding: 22px 16px; overflow-x: auto; text-align: center; background:
  linear-gradient(var(--surface), var(--surface)) padding-box,
  radial-gradient(#e9edf4 1px, transparent 1px) 0 0 / 18px 18px; }
.diagram-body .mermaid { display: block; width: 100%; text-align: center; }
.diagram-body .mermaid.wide { min-width: 640px; }
.diagram-body .mermaid svg { display: inline-block; height: auto; }
.mermaid-fallback { text-align: left; font-family: var(--mono); font-size: 12.5px; white-space: pre; color: var(--text-2); background: #f6f8fb; border-radius: 8px; padding: 14px; overflow-x: auto; }
.diagram-explain { border-top: 1px dashed var(--border); padding: 18px 22px 20px; background: #fcfcfe; }
.diagram-explain h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
.diagram-explain p { font-size: 14.8px; }
.diagram-explain ol, .diagram-explain ul { font-size: 14.8px; margin: 6px 0; }

/* sequence steps */
.steps { list-style: none; padding: 0 !important; margin: 10px 0; counter-reset: st; }
.steps > li { counter-increment: st; position: relative; padding: 2px 0 12px 40px; margin: 0; }
.steps > li::before {
  content: counter(st); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: #fff; background: var(--ink-2);
}
.steps > li:not(:last-child)::after { content: ""; position: absolute; left: 12.5px; top: 30px; bottom: 2px; width: 1px; background: var(--border); }

/* legend chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
.chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* compare */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0; }
.vs .side { border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.vs .side h4 { margin: 0; padding: 13px 18px; color: #fff; font-size: 15.5px; }
.vs .side .sb { padding: 14px 18px 16px; }
.vs .side .sb p, .vs .side .sb li { font-size: 14.8px; }
.vs .side.a h4 { background: linear-gradient(135deg, #334155, #475569); }
.vs .side.b h4 { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.vs .side .lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 12px 0 2px; }
.vs .side .lbl:first-child { margin-top: 0; }
.vs .side ul { margin: 4px 0; }

/* rounded corners for every Mermaid box (matches the SVG architecture diagrams) */
.diagram-body .mermaid .node rect, .diagram-body .mermaid .node .label-container:not(path) { rx: 9px; ry: 9px; }
.diagram-body .mermaid .cluster rect { rx: 12px; ry: 12px; }
.diagram-body .mermaid rect.actor, .diagram-body .mermaid rect.note, .diagram-body .mermaid rect.labelBox, .diagram-body .mermaid rect.rect { rx: 8px; ry: 8px; }

/* hand-drawn SVG architecture diagrams (see _build/svg.js) */
.ksvg { width: 100%; height: auto; display: inline-block; font-family: var(--font); }
.ksvg text { font-size: 13.5px; fill: #1d2433; }
.ksvg .t-h { font-weight: 700; } .ksvg .t-s { font-size: 12.5px; fill: #3f4859; } .ksvg .t-w { fill: #fff; font-weight: 600; }
.ksvg .t-m { font-size: 20px; fill: #6b7486; } .ksvg .t-c { font-size: 11px; font-family: var(--mono); fill: #1e3a8a; }
.ksvg .lbl { paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.ksvg .broker { fill: #fffaf6; stroke: #ea580c; stroke-width: 1.6; }
.ksvg .topic { fill: #ffffff; stroke: #dc2626; stroke-width: 1.3; }
.ksvg .cell { fill: #f5f8ff; stroke: #2563eb; stroke-width: 1.1; }
.ksvg .cell.ev { fill: #dbe7ff; } .ksvg .cell.hot { fill: #ea580c; stroke: #9a3412; }
.ksvg .prod { fill: #111a2e; stroke: #ea580c; stroke-width: 2; }
.ksvg .grp { fill: #f3fbfa; stroke: #0f9d8f; stroke-width: 1.4; }
.ksvg .cons { fill: #e8f7f5; stroke: #0f9d8f; stroke-width: 1.2; }
.ksvg .arrow { fill: none; stroke: #475569; stroke-width: 1.7; }
.ksvg .stepbox { fill: #ffffff; stroke: #334155; stroke-width: 1.3; }
.ksvg .brkbox { fill: #fff4ec; stroke: #ea580c; stroke-width: 1.5; }
.ksvg .t-b { font-size: 12.5px; fill: #1d2433; }
.ksvg .t-red { font-size: 12px; fill: #c0392b; font-style: italic; }
.ksvg .t-meta { font-size: 12px; fill: #3f4859; font-family: var(--mono); }
.ksvg .arrow-b { fill: none; stroke: #2563eb; stroke-width: 1.5; }
.ksvg .cluster { fill: #fbfcfe; stroke: #a16207; stroke-width: 1.6; }
.ksvg .sep { stroke: #a16207; stroke-width: 1.2; }
.ksvg .pill-l { fill: #ea580c; stroke: #9a3412; stroke-width: 1.2; }
.ksvg .pill-f { fill: #eef4ff; stroke: #2563eb; stroke-width: 1.2; }
.ksvg .t-f { fill: #1e3a8a; font-weight: 600; }
.ksvg .ctl { fill: #f4efff; stroke: #7c3aed; stroke-width: 1.5; }
.ksvg .ctl-a { fill: #7c3aed; stroke: #4c1d95; stroke-width: 1.5; }
.ksvg .t-v { fill: #4c1d95; font-weight: 600; }
.ksvg .lifeline { fill: #cbd5e1; stroke: none; }
.ksvg .wopen { fill: #e8f7f5; stroke: #0f9d8f; stroke-width: 1.3; }
.ksvg .wclosed { fill: #f1f3f8; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; }

/* log / offset visualisation */
.logviz { margin: 12px 0 6px; }
.logviz .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.logviz .lab { font-size: 12.5px; font-weight: 700; color: var(--text-2); min-width: 118px; }
.logviz .cells { display: flex; gap: 4px; flex-wrap: wrap; }
.logviz .cell { min-width: 46px; text-align: center; font-family: var(--mono); font-size: 11.5px; padding: 7px 6px; border-radius: 7px; border: 1px solid #fed7bf; background: var(--accent-soft); color: var(--accent-text); }
.logviz .cell small { display: block; font-size: 10px; color: var(--muted); }
.logviz .cell.gone { background: #f1f3f8; border-style: dashed; border-color: #cfd6e2; color: #9aa3b5; text-decoration: line-through; }
.logviz .cell.new { background: var(--teal-soft); border-color: #b7e6df; color: var(--teal); }
.logviz .ptr { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--ink-2); color: #fff; }
.logviz .ptr.t { background: var(--teal); }
.logviz .cell.bad { background: #fdecea; border-color: #f5b5ae; color: #b42318; }
.logviz .cell.ctl { background: #f4efff; border-color: #d6c7fb; color: #5b21b6; }
.logviz .cell.open { background: #fff7e0; border-color: #f5d27a; color: #92600a; }
.logviz .ptr.v { background: #7c3aed; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.badge.ok { background: var(--teal-soft); color: var(--teal); }
.badge.bad { background: #fdecea; color: #b42318; }
.vs .side pre.mini { margin: 6px 0 10px; padding: 9px 11px; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- Code & terminal ---------- */
.code { position: relative; margin: 18px 0; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-border); box-shadow: var(--shadow); }
.code-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: #161b22; border-bottom: 1px solid var(--code-border); color: #9aa6bd; font-size: 12.5px; font-family: var(--mono); }
.code-head .dots { display: flex; gap: 6px; }
.code-head .dots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: #ff5f57; }
.code-head .dots i:nth-child(2) { background: #febc2e; }
.code-head .dots i:nth-child(3) { background: #28c840; }
.code-head .fname { flex: 1; min-width: 0; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-head .lang { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #f0883e; }
.copy-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font: 600 11.5px var(--font); padding: 4px 10px; cursor: pointer; }
.copy-btn:hover { background: #30363d; }
.code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-family: var(--mono); font-size: 13.4px; line-height: 1.65; color: #e6edf3; tab-size: 4; }
.code.terminal .code-head .lang { color: #3fb950; }
.code.log pre { font-size: 12.6px; }
.tok-kw { color: #ff7b72; } .tok-str { color: #a5d6ff; } .tok-com { color: #8b949e; font-style: italic; }
.tok-num { color: #79c0ff; } .tok-ann { color: #d2a8ff; } .tok-type { color: #ffa657; } .tok-key { color: #7ee787; }
.tok-prompt { color: #3fb950; user-select: none; } .tok-flag { color: #d2a8ff; }
.log-info { color: #58a6ff; font-weight: 600; } .log-warn { color: #e3b341; font-weight: 600; } .log-error { color: #f85149; font-weight: 600; }
.log-debug { color: #8b949e; } .log-ts { color: #7d8590; }

/* ---------- Pipeline stage tracker ---------- */
.stages { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 18px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.stages .st { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #f1f3f8; color: var(--muted); border: 1px solid #e3e7ef; white-space: nowrap; }
.stages .st.done { background: var(--teal-soft); color: var(--teal); border-color: #b7e6df; }
.stages .st.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(234,88,12,.3); }
.stages .ar { color: #9aa3b5; font-size: 13px; }

/* ---------- Record accumulator batch boxes ---------- */
.batches { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 6px 0; }
.batch { width: 168px; border-radius: 12px; border: 1.5px solid #2563eb; background: #f5f8ff; overflow: hidden; text-align: left; }
.batch .bh { padding: 7px 10px; font-size: 11.5px; line-height: 1.35; background: #e4ecff; color: #1e3a8a; font-weight: 600; }
.batch .bb { min-height: 86px; padding: 8px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; }
.batch .ev { font-family: var(--mono); font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: #fff; }
.batch .bf { padding: 5px 10px; font-size: 11px; color: var(--muted); border-top: 1px dashed #c7d5f5; text-align: center; }
.grid .batches { gap: 8px; }
.batch.empty .bb::after { content: 'empty'; font-size: 11px; color: #9aa3b5; margin: auto; }
.flow-node { display: inline-block; padding: 8px 18px; border-radius: 10px; font-weight: 700; font-size: 13.5px; background: var(--ink-2); color: #fff; border: 2px solid var(--accent); }
.flow-down { text-align: center; color: #64748b; font-size: 18px; line-height: 1.2; margin: 4px 0; }
.flow-down small { display: block; font-size: 11.5px; color: var(--muted); }
.compress-bar { height: 26px; border-radius: 8px; display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 12.5px; font-weight: 700; margin: 6px 0; }

/* ---------- OS command tabs (macOS / Linux vs Windows) ---------- */
.os-tabs { margin: 18px 0; }
.os-tabs .os-bar { display: flex; gap: 6px; margin-bottom: -1px; position: relative; z-index: 1; }
.os-tabs .os-btn { font: 600 12.5px var(--font); padding: 7px 14px; border-radius: 9px 9px 0 0; border: 1px solid var(--border); border-bottom: 0; background: var(--surface-2); color: var(--muted); cursor: pointer; }
.os-tabs .os-btn.on { background: #161b22; border-color: var(--code-border); color: #fff; }
.os-tabs .os-btn:hover:not(.on) { color: var(--accent-text); }
.os-tabs > .code { margin: 0; border-top-left-radius: 0; }
.os-tabs > .code:not(.on) { display: none; }

/* ---------- Summary / related ---------- */
.summary { border-radius: var(--radius); padding: 22px 26px; margin: 26px 0; color: #e8edf6; background: linear-gradient(135deg, #0f1a2e, #1c2a46); box-shadow: var(--shadow-lg); }
.summary h3 { margin: 0 0 10px; color: #fff; }
.summary ul { margin: 0; color: #cfd8e8; }
.summary li::marker { color: var(--accent-2); }
.summary strong { color: #fff; }
.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 16px 0; }
.related a { display: block; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--text); transition: transform .15s, border-color .15s; }
.related a:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--accent); }
.related a small { display: block; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.related a span { font-weight: 600; font-size: 14.5px; }
.related a em { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 2px; }
.related .soon { display: block; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--border); color: var(--muted); }
.related .soon small { display: block; font-size: 11.5px; font-family: var(--mono); }
.related .soon span { font-weight: 600; font-size: 14.5px; }
.related .soon em { display: block; font-style: normal; font-size: 13px; margin-top: 2px; }
.related .soon i { display: inline-block; margin-top: 8px; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: #eef0f5; }
.soon-link { border-bottom: 1px dashed var(--muted); color: var(--text-2); cursor: help; }

/* ---------- Home page ---------- */
.home-btn-inline { display: inline-block; font-weight: 700; color: #fff; padding: 11px 20px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px rgba(234,88,12,.28); }
.home-btn-inline:hover { text-decoration: none; filter: brightness(1.07); }
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 12px 0 26px; }
.chapter-card { position: relative; display: block; padding: 16px 18px 40px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--text); transition: transform .15s, border-color .15s; }
a.chapter-card:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--accent); }
.chapter-card small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--accent-text); font-weight: 600; }
.chapter-card span { display: block; font-weight: 700; font-size: 15.5px; margin: 3px 0 5px; line-height: 1.35; }
.chapter-card em { display: block; font-style: normal; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.chapter-card .status { position: absolute; left: 18px; bottom: 12px; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: #eef0f5; color: var(--muted); }
.chapter-card .status.ok { background: var(--green-soft); color: var(--green); }
.chapter-card.soon { opacity: .72; cursor: default; }
.side-home.active { background: linear-gradient(90deg, rgba(234,88,12,.22), rgba(234,88,12,.04)); }

.side-cheat, .side-qbank, .side-gloss { margin-top: -4px; }
.side-cheat.active, .side-qbank.active, .side-gloss.active { background: linear-gradient(90deg, rgba(234,88,12,.22), rgba(234,88,12,.04)); }

/* ---------- SDE level badges & question bank ---------- */
.lv { display: inline-block; vertical-align: 1px; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
.lv1 { background: #e8f7f5; color: #0b6b61; }
.lv2 { background: #eef4ff; color: #1e4fb8; }
.lv3 { background: #f4efff; color: #5b21b6; }
.lvs { background: #fff4ec; color: #b4440a; }
.qbank-filters { padding: 10px 0 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.qbank-filters .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 5px 0; }
.qbank-filters .flab { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); min-width: 46px; }
.qbank-filters .fbtn { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-2); }
.qbank-filters .fbtn em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 2px; }
.qbank-filters .fbtn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.qbank-filters .fbtn.on em { color: rgba(255,255,255,.85); }
.qbank-filters .cs-filter { margin: 0; }
.qbank-filters .qbar { justify-content: space-between; }
.qbank .qsrc { font-size: 13px; color: var(--muted); margin-top: 8px; }
.qbank .qi.qhide, .qbank h2.qhide { display: none; }

/* ---------- Cheat sheet ---------- */
.cs-filter { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); font: inherit; font-size: 15px; background: var(--surface); outline: none; margin: 6px 0 4px; }
.cs-filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
.cs-count { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.cs-table { table-layout: fixed; width: 100%; }
.cs-table th:nth-child(1) { width: 25%; } .cs-table th:nth-child(2) { width: 17%; } .cs-table th:nth-child(3) { width: 19%; } .cs-table th:nth-child(5) { width: 84px; }
.cs-table td { overflow-wrap: anywhere; vertical-align: top; }
.cs-table td code { white-space: normal; overflow-wrap: anywhere; }
.cs-table td:last-child { overflow-wrap: normal; }
.cs-chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); margin: 1px 0; }
.cs-chip:hover { text-decoration: none; filter: brightness(.95); }
.cs-hide { display: none; }

/* ---------- Interactive widgets (assets/widgets.js) ---------- */
.kw { margin: 22px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; outline: none; }
.kw:focus-visible { box-shadow: 0 0 0 3px rgba(234,88,12,.25); }
.kw-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, #fff7f0, #fff); }
.kw-head b { font-size: 15px; }
.kw-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); padding: 3px 8px; border-radius: 999px; }
.kw-sub { font-size: 12.5px; color: var(--muted); }
.kw-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px 4px; font-size: 13.5px; color: var(--text-2); }
.kw-controls label { display: inline-flex; align-items: center; gap: 6px; }
.kw-controls input[type=text], .kw-controls select { font: inherit; font-size: 13.5px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.kw-controls input[type=text] { width: 150px; font-family: var(--mono); }
.kw-controls input[type=range] { width: 100px; accent-color: var(--accent); }
.kw-btn { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 13px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.kw-btn.ghost { color: var(--text-2); background: var(--surface); border-color: var(--border); font-weight: 600; }
.kw-btn:disabled { opacity: .4; cursor: default; }
.kw-out, .kw-stats, .kw-st { padding: 8px 16px; font-size: 13.5px; color: var(--text-2); }
.kw-out code, .kw-st code { font-size: 12.5px; }
.kw-note { padding: 10px 16px 14px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--border); margin-top: 6px; }
.kw-good { color: var(--teal); font-weight: 700; } .kw-bad { color: #b42318; font-weight: 700; }
.kw-parts, .kw-cons { display: grid; gap: 8px; padding: 6px 16px 10px; }
.kw-part, .kw-con { display: flex; align-items: flex-start; gap: 10px; }
.kw-ph, .kw-ch { flex: none; width: 70px; font-weight: 800; font-size: 13px; padding-top: 6px; color: var(--text-2); }
.kw-con.idle .kw-ch { color: var(--muted); }
.kw-cells { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; flex: 1; padding: 3px; border-radius: 8px; background: #f6f8fb; }
.kw-rec, .kw-pp { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid #fed7bf; }
.kw-rec small { display: block; font-size: 9.5px; color: var(--muted); }
.kw-rec.new { animation: kwPop .6s ease; box-shadow: 0 0 0 2px var(--accent); }
.kw-pp.kept { background: var(--teal-soft); color: var(--teal); border-color: #b7e6df; }
.kw-pp.paused { background: #fff7e0; color: #92600a; border-color: #f5d27a; }
.kw-pp.moved { background: #f4efff; color: #5b21b6; border-color: #d6c7fb; animation: kwPop .6s ease; }
.kw-empty { font-size: 12px; color: var(--muted); padding: 5px; }
@keyframes kwPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: none; opacity: 1; } }
/* window simulator */
.kw-time { position: relative; margin: 12px 16px 4px; height: 82px; border-radius: 10px; background: repeating-linear-gradient(90deg, #f6f8fb 0, #f6f8fb calc(100%/12 - 1px), #e6eaf2 calc(100%/12 - 1px), #e6eaf2 calc(100%/12)); cursor: crosshair; }
.kw-axis { position: absolute; left: 0; right: 0; bottom: 4px; height: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); pointer-events: none; }
.kw-axis span { position: absolute; transform: translateX(-50%); }
.kw-axis span:first-child { transform: none; }
.kw-axis span:last-child { transform: translateX(-100%); }
.kw-evs { position: absolute; inset: 0; pointer-events: none; }
.kw-ev { position: absolute; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--teal); }
.kw-ev.late { background: #d97706; } .kw-ev.drop { background: #b42318; text-decoration: line-through; }
.kw-stl { position: absolute; top: 0; bottom: 18px; border-left: 2px dashed var(--accent); }
.kw-stl em { position: absolute; left: 4px; top: 54px; font-style: normal; font-size: 10.5px; color: var(--accent-text); white-space: nowrap; }
.kw-wins { margin: 4px 16px 6px; display: grid; gap: 6px; } /* same left/right edges as .kw-time, so bars line up with the timeline */
.kw-win { position: relative; display: grid; gap: 3px; padding: 6px 0; border-bottom: 1px solid #eef1f6; }
.kw-win .kw-wl { padding: 0 2px; }
.kw-win .kw-track { position: relative; height: 10px; }
.kw-bar { position: absolute; top: 0; height: 10px; border-radius: 5px; background: var(--teal); }
.kw-win.closed .kw-bar { background: #94a3b8; }
.kw-wl { font-size: 12.5px; color: var(--text-2); }
.kw-win.closed .kw-wl { color: var(--muted); }
/* step-through flows */
.kw-stage { position: relative; padding: 14px 12px 6px; overflow-x: auto; }
.kw-lanes { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(110px, 1fr); gap: 10px; min-width: 560px; padding-bottom: 54px; }
.kw-lane { border: 1px solid var(--border); border-radius: 10px; background: #fbfcfe; padding: 8px; transition: border-color .25s, box-shadow .25s, background .25s; min-height: 92px; }
.kw-lane.on { border-color: var(--accent); background: #fff7f0; box-shadow: 0 0 0 3px rgba(234,88,12,.12); }
.kw-lh { font-weight: 800; font-size: 12.5px; text-align: center; color: var(--text); }
.kw-lst { margin-top: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--text-2); text-align: center; line-height: 1.45; overflow-wrap: anywhere; }
.kw-msg { position: absolute; bottom: 8px; height: 40px; display: none; }
.kw-lanes > .kw-msg { }
.kw-msg.show { display: block; }
.kw-msg::before { content: ""; position: absolute; left: 0; right: 0; top: 26px; border-top: 2.5px solid #475569; }
.kw-msg::after { content: ""; position: absolute; right: -2px; top: 20.5px; border: 7px solid transparent; border-left: 10px solid #475569; border-right: 0; }
.kw-msg.rev::after { right: auto; left: -2px; border-left: 0; border-right: 10px solid #475569; }
.kw-msg.ok::before { border-color: var(--teal); } .kw-msg.ok::after { border-left-color: var(--teal); } .kw-msg.ok.rev::after { border-right-color: var(--teal); border-left-color: transparent; }
.kw-msg.bad::before { border-color: #b42318; } .kw-msg.bad::after { border-left-color: #b42318; } .kw-msg.bad.rev::after { border-right-color: #b42318; border-left-color: transparent; }
.kw-msg.b::before { border-color: #2563eb; border-top-style: dashed; } .kw-msg.b::after { border-left-color: #2563eb; } .kw-msg.b.rev::after { border-right-color: #2563eb; border-left-color: transparent; }
.kw-msg span { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 11.5px; background: #fff; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); animation: kwPop .45s ease; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
.kw-cap { margin: 0 16px; padding: 10px 14px; border-radius: 10px; background: #111a2e; color: #e8edf6; font-size: 14px; line-height: 1.55; min-height: 66px; }
.kw-cap .kw-cn { display: block; color: #fdba74; font-size: 12.5px; margin-bottom: 3px; }
.kw-cap b:not(.kw-cn) { color: #fff; }
.kw-cap code { background: rgba(255,255,255,.1); color: #fff; }
.kw-nav { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
.kw-dots { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; justify-content: center; }
.kw-stage.can-scroll::after { content: "\2194  swipe to see all lanes \2014 the active ones scroll into view"; display: block; position: sticky; left: 0; font-size: 11.5px; color: var(--muted); padding: 2px 4px 0; }
.kw-dot { width: 11px; height: 11px; border-radius: 50%; border: 0; padding: 0; background: #d5dbe6; cursor: pointer; }
.kw-dot.done { background: #fdba74; } .kw-dot.on { background: var(--accent); transform: scale(1.25); }
@media (max-width: 720px) {
  .kw-controls { padding: 10px 12px 2px; } .kw-parts, .kw-cons { padding-left: 12px; padding-right: 12px; } .kw-wins { margin-left: 12px; margin-right: 12px; }
  .kw-ph, .kw-ch { width: 48px; } .kw-time { margin: 10px 12px 4px; }
  .kw-cap { margin: 0 10px; font-size: 13.5px; } .kw-nav { padding: 10px 12px 12px; }
  .kw-nav .kw-dots { order: 3; flex-basis: 100%; }
  /* phones: squeeze all lanes onto the screen so every message arrow is visible at once */
  .kw-stage { padding: 10px 6px 4px; }
  .kw-lanes { min-width: 0; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding-bottom: 60px; }
  .kw-lane { padding: 5px 3px; min-height: 84px; border-radius: 8px; }
  .kw-lh { font-size: 10.5px; line-height: 1.25; overflow-wrap: anywhere; }
  .kw-lst { font-size: 9.5px; line-height: 1.35; }
  .kw-msg span { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 48px); font-size: 10.5px; line-height: 1.3; }
  .kw-msg { height: 46px; } .kw-msg::before { top: 34px; } .kw-msg::after { top: 28.5px; }
}

/* ---------- Glossary terms & tooltip ---------- */
.gl { text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; border-radius: 3px; }
.gl:hover, .gl:focus { background: var(--accent-soft); outline: none; }
.gl-tip { position: fixed; z-index: 60; padding: 11px 14px 10px; border-radius: 10px; background: #111a2e; color: #e8edf6; box-shadow: 0 10px 30px rgba(10,15,30,.35); font-size: 13.5px; line-height: 1.5; }
.gl-tip b { display: block; color: #fff; font-size: 14px; margin-bottom: 3px; }
.gl-tip span { display: block; }
.gl-tip em { display: block; font-style: normal; font-size: 12.5px; margin-top: 7px; color: #9aa6bd; }
.gl-tip a { color: #fdba74; }
.gl-list { display: grid; gap: 10px; margin: 12px 0; }
.gl-item { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px 16px; scroll-margin-top: 80px; }
.gl-item:target { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234,88,12,.15); }
.gl-item h4 { margin: 0 0 3px; font-size: 15.5px; }
.gl-item p { margin: 0; color: var(--text-2); font-size: 14.8px; }
.gl-item .cs-chip { margin-left: 6px; vertical-align: 1px; }
.gl-letter { font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--accent-text); margin: 18px 0 2px; }

/* ---------- Chapter quiz ---------- */
.quiz { margin: 34px 0 10px; }
.quiz .qi { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); margin: 12px 0; overflow: hidden; }
.quiz .qh { display: flex; gap: 12px; align-items: flex-start; padding: 15px 18px; }
.quiz .qn { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.quiz .qq { flex: 1; font-weight: 600; font-size: 15.5px; line-height: 1.5; }
.quiz .qbtn { flex: none; font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent-text); background: var(--accent-soft); cursor: pointer; }
.quiz .qbtn:hover { filter: brightness(.96); }
.quiz .qa { display: none; padding: 0 18px 16px 58px; color: var(--text-2); font-size: 14.8px; line-height: 1.6; }
.quiz .qa p { margin: 6px 0; }
.quiz .qi.open .qa { display: block; }
.quiz .qi.open .qh { background: #fbfcfe; }
.quiz .qtools { display: flex; gap: 8px; justify-content: flex-end; margin: -4px 0 4px; }
.quiz .qtools button { font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-2); }

/* ---------- Collapsible panels ---------- */
.side-top { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
.side-top .side-search { margin: 0; flex: 1; }
.panel-btn { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font: 700 15px var(--font); }
.side-collapse { background: var(--ink-3); color: #c9d2e3; border: 1px solid #2a3755; }
.side-collapse:hover { color: #fff; border-color: var(--accent); }
.toc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.toc-head h5 { margin: 0; }
.toc-close { width: 28px; height: 28px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); font-size: 14px; }
.toc-close:hover { color: var(--accent-text); border-color: var(--accent); }
.toc-open {
  display: none; position: fixed; right: 0; top: calc(var(--topbar-h) + 26px); z-index: 35; cursor: pointer;
  writing-mode: vertical-rl; padding: 14px 8px; border-radius: 10px 0 0 10px; border: 1px solid var(--border); border-right: 0;
  background: var(--surface); color: var(--text-2); font: 600 12.5px var(--font); letter-spacing: .04em; box-shadow: var(--shadow);
}
.toc-open:hover { color: var(--accent-text); border-color: var(--accent); }
.sidebar, .layout { transition: transform .25s ease, margin-left .25s ease; }
body.side-collapsed .sidebar { transform: translateX(-100%); }
body.side-collapsed .layout { margin-left: 0; }
body.toc-collapsed .toc { display: none; }
body.toc-collapsed.has-toc .toc-open { display: block; }
/* both panels closed -> content uses the full width (right padding leaves room for the "On this page" tab) */
body.side-collapsed.toc-collapsed .main, body.side-collapsed:not(.has-toc) .main { max-width: none; padding-left: 56px; padding-right: 72px; }
@media (max-width: 960px) { body.side-collapsed.toc-collapsed .main, body.side-collapsed:not(.has-toc) .main { padding-left: 20px; padding-right: 20px; } }

/* ---------- Pager ---------- */
.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--border); }
.pager a, .pager span.ph { display: block; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); color: var(--text); }
.pager a:hover { text-decoration: none; border-color: var(--accent); }
.pager small { display: block; font-size: 12px; color: var(--muted); }
.pager b { font-size: 14.5px; }
.pager .next { text-align: right; }
.pager .home { display: grid; place-items: center; font-weight: 700; color: var(--accent-text); }
.pager span.ph { visibility: hidden; }
.pager span.ph-soon { display: block; padding: 14px 18px; border-radius: 12px; border: 1px dashed var(--border); color: var(--muted); }
.site-foot { margin-top: 40px; font-size: 13px; color: var(--muted); text-align: center; }
.site-foot b { color: var(--text-2); }

/* back-to-top */
.to-top { position: fixed; right: 22px; bottom: 22px; width: 42px; height: 42px; border-radius: 12px; border: 0; cursor: pointer; z-index: 30;
  background: var(--ink-2); color: #fff; font-size: 18px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s; }
.to-top.show { opacity: 1; pointer-events: auto; }
.progress { position: fixed; top: var(--topbar-h); left: 0; height: 3px; z-index: 60; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) { body:not(.side-collapsed) .toc, body:not(.side-collapsed) .toc-open { display: none !important; } }
@media (max-width: 1000px) { .toc, .toc-open { display: none !important; } }
@media (max-width: 960px) {
  .sidebar { transform: translateX(-100%); transition: transform .25s; box-shadow: var(--shadow-lg); }
  body.nav-open .sidebar { transform: none; }
  .layout { margin-left: 0; }
  .main { padding: 26px 20px 50px; }
  .topbar .author-chip { display: none; }
}
@media (max-width: 720px) {
  .grid-2, .grid-3, .vs { grid-template-columns: 1fr; }
  #content, .hero { overflow-wrap: anywhere; } /* long property names and URLs wrap instead of widening the page */
  #content pre, #content pre * { overflow-wrap: normal; }
  .grid > *, .vs > *, .points > li { min-width: 0; }
  .main { padding: 20px 14px 44px; }
  .diagram-body { padding: 16px 10px; }
  .code pre { font-size: 12px; }
  .callout { padding: 13px 14px; gap: 10px; }
  .table-wrap table { font-size: 13.5px; }
  .quiz .qh { flex-wrap: wrap; } .quiz .qbtn { margin-left: 40px; } .quiz .qa { padding-left: 18px; }
  .diagram-body.can-scroll::after { content: "\2194  swipe sideways to see the whole diagram"; display: block; position: sticky; left: 0; margin-top: 10px; font-size: 12px; color: var(--muted); text-align: left; }
  .hero { padding: 26px 22px; }
  .hero h1 { font-size: 27px; }
  .main h2 { font-size: 22px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { text-align: left; }
}
@media print {
  .topbar, .sidebar, .toc, .to-top, .progress, .pager, .copy-btn { display: none !important; }
  .layout { margin: 0; padding: 0; }
  .hero { color: #000; background: none; box-shadow: none; border: 1px solid #ccc; }
}
</style>

<script src="assets/mermaid.min.js"></script>
<script>
(function () {
  /* ---------- Small screens: keep diagrams readable ----------
     A diagram scaled to fit a phone can end up at 25% size. Below MIN_SCALE we give it a fixed
     readable width instead and let its .diagram-body scroll sideways (with a swipe hint). */
  var MIN_SCALE = 0.6, SMALL = 900;
  function fitSmallScreens() {
    var small = window.innerWidth <= SMALL;
    document.querySelectorAll('.diagram-body').forEach(function (body) {
      body.classList.remove('can-scroll');
      body.querySelectorAll('svg').forEach(function (s) {
        if (s.closest('.cells') || !s.viewBox || !s.viewBox.baseVal || !s.viewBox.baseVal.width) return;
        s.style.minWidth = '';
        if (!small) return;
        var natural = s.viewBox.baseVal.width, avail = body.clientWidth - 20;
        if (avail / natural < MIN_SCALE) { s.style.minWidth = Math.round(natural * MIN_SCALE) + 'px'; }
      });
      if (body.scrollWidth > body.clientWidth + 4) body.classList.add('can-scroll');
    });
  }
  var fitTimer; window.addEventListener('resize', function () { clearTimeout(fitTimer); fitTimer = setTimeout(fitSmallScreens, 150); });
  fitSmallScreens();

  /* ---------- Mermaid ---------- */
  var blocks = document.querySelectorAll('.mermaid');
  blocks.forEach(function (b) { b.setAttribute('data-src', b.textContent); });
  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'loose', theme: 'base',
      fontFamily: 'Inter, Segoe UI, Arial, sans-serif',
      themeVariables: {
        fontSize: '15px',
        primaryColor: '#fff4ec', primaryBorderColor: '#ea580c', primaryTextColor: '#1d2433',
        secondaryColor: '#e8f7f5', tertiaryColor: '#eef4ff',
        lineColor: '#475569', textColor: '#1d2433',
        actorBkg: '#111a2e', actorBorder: '#ea580c', actorTextColor: '#ffffff', actorLineColor: '#94a3b8',
        signalColor: '#334155', signalTextColor: '#1d2433',
        labelBoxBkgColor: '#111a2e', labelBoxBorderColor: '#ea580c', labelTextColor: '#ffffff', loopTextColor: '#1d2433',
        noteBkgColor: '#fff8e6', noteBorderColor: '#d97706', noteTextColor: '#78350f',
        activationBkgColor: '#ffe3cf', activationBorderColor: '#ea580c',
        clusterBkg: '#f9fafc', clusterBorder: '#cbd5e1', edgeLabelBackground: '#ffffff'
      },
      sequence: { useMaxWidth: true, mirrorActors: false, boxMargin: 10, messageMargin: 38, noteMargin: 12, actorMargin: 60 },
      flowchart: { useMaxWidth: true, curve: 'basis', htmlLabels: true, padding: 14 }
    });
    // Render only after web fonts load, otherwise Mermaid measures labels with the fallback font and clips them.
    var render = function () { mermaid.run({ nodes: blocks }).then(fitSmallScreens).catch(function (e) { console.error(e); }); };
    if (document.fonts && document.fonts.ready) {
      Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 2500); })]).then(render);
    } else { render(); }
  } else {
    blocks.forEach(function (b) {
      b.className = 'mermaid-fallback';
      b.textContent = '/* Diagram renderer could not load (offline). Diagram definition: */\n\n' + b.getAttribute('data-src').trim();
    });
  }

  /* ---------- Syntax highlighting (lightweight) ---------- */
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var LANG = {
    java: { kw: /\b(abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|volatile|while|var|null|true|false|record)\b/ },
    yaml: { yaml: true }, properties: { yaml: true },
    bash: { bash: true }, shell: { bash: true }, cmd: { bash: true }, powershell: { bash: true },
    json: { json: true }, sql: { kw: /\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|PRIMARY|KEY|NOT|NULL|AND|OR|BEGIN|COMMIT|ROLLBACK|VARCHAR|INT|BIGINT|TIMESTAMP|DEFAULT|ORDER|BY|LIMIT)\b/i },
    xml: { xml: true }
  };
  function hlGeneric(src, kw) {
    var re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|--[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[LlFfDd]?\b)|(\b[A-Za-z_]\w*\b)/g;
    var out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index)); last = re.lastIndex;
      if (m[1]) out += '<span class="tok-com">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-str">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-ann">' + esc(m[3]) + '</span>';
      else if (m[4]) out += '<span class="tok-num">' + esc(m[4]) + '</span>';
      else if (m[5]) {
        if (kw && kw.test(m[5])) out += '<span class="tok-kw">' + m[5] + '</span>';
        else if (/^[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*$/.test(m[5])) out += '<span class="tok-type">' + m[5] + '</span>';
        else out += m[5];
      }
    }
    return out + esc(src.slice(last));
  }
  function hlYaml(src) {
    return src.split('\n').map(function (line) {
      var c = line.match(/^(\s*)(#.*)$/);
      if (c) return c[1] + '<span class="tok-com">' + esc(c[2]) + '</span>';
      var k = line.match(/^(\s*-?\s*)([\w.\-\[\]"']+)(\s*[:=])(.*)$/);
      if (k) {
        var v = k[4], cm = '';
        var ci = v.indexOf(' #'); if (ci >= 0) { cm = '<span class="tok-com">' + esc(v.slice(ci)) + '</span>'; v = v.slice(0, ci); }
        var vv = /^\s*(\d+|true|false|null)\s*$/.test(v) ? '<span class="tok-num">' + esc(v) + '</span>' : '<span class="tok-str">' + esc(v) + '</span>';
        return esc(k[1]) + '<span class="tok-key">' + esc(k[2]) + '</span>' + esc(k[3]) + vv + cm;
      }
      return esc(line);
    }).join('\n');
  }
  function hlBash(src) {
    return src.split('\n').map(function (line) {
      if (/^\s*#/.test(line)) return '<span class="tok-com">' + esc(line) + '</span>';
      var p = line.match(/^(\s*(?:\$|>|PS [^>]*>)\s)(.*)$/);
      var pre = '', body = line;
      if (p) { pre = '<span class="tok-prompt">' + esc(p[1]) + '</span>'; body = p[2]; }
      // one pass, so the markup inserted for flags is never re-matched as a string
      body = esc(body).replace(/("[^"]*")|(^|\s)(--?[\w.\-]+)/g, function (m, str, sp, flag) {
        return str ? '<span class="tok-str">' + str + '</span>' : sp + '<span class="tok-flag">' + flag + '</span>';
      });
      return pre + body;
    }).join('\n');
  }
  function hlJson(src) {
    return esc(src).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(-?\d+(?:\.\d+)?|true|false|null)\b/g, function (m, s, colon, n) {
      if (s) return colon ? '<span class="tok-key">' + s + '</span>' + colon : '<span class="tok-str">' + s + '</span>';
      return '<span class="tok-num">' + n + '</span>';
    });
  }
  function hlXml(src) {
    // one pass over the escaped source, so inserted markup is never re-matched
    return esc(src).replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w.:\-]+)|([\w:\-]+)=("[^"]*")/g, function (m, com, lt, tag, attr, val) {
      if (com) return '<span class="tok-com">' + com + '</span>';
      if (tag) return lt + '<span class="tok-kw">' + tag + '</span>';
      return '<span class="tok-key">' + attr + '</span>=<span class="tok-str">' + val + '</span>';
    });
  }
  function hlLog(src) {
    return esc(src).split('\n').map(function (l) {
      return l.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.,]+(?:[+\-]\d{2}:?\d{2}|Z)?)/, '<span class="log-ts">$1</span>')
              .replace(/\b(INFO)\b/, '<span class="log-info">$1</span>')
              .replace(/\b(WARN|WARNING)\b/, '<span class="log-warn">$1</span>')
              .replace(/\b(ERROR|FATAL|Exception)\b/, '<span class="log-error">$1</span>')
              .replace(/\b(DEBUG|TRACE)\b/, '<span class="log-debug">$1</span>');
    }).join('\n');
  }
  document.querySelectorAll('.code pre code').forEach(function (el) {
    var lang = (el.getAttribute('data-lang') || '').toLowerCase(), src = el.textContent, cfg = LANG[lang];
    if (lang === 'log') el.innerHTML = hlLog(src);
    else if (!cfg || lang === 'text') return;
    else if (cfg.yaml) el.innerHTML = hlYaml(src);
    else if (cfg.bash) el.innerHTML = hlBash(src);
    else if (cfg.json) el.innerHTML = hlJson(src);
    else if (cfg.xml) el.innerHTML = hlXml(src);
    else el.innerHTML = hlGeneric(src, cfg.kw);
  });
  document.querySelectorAll('.copy-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var code = btn.closest('.code').querySelector('pre').innerText;
      // terminal blocks: copy only the commands (lines with a $ or > prompt), without the prompt or output
      var cmdLines = code.split('\n').filter(function (l) { return /^(\$|>) /.test(l); });
      if (cmdLines.length) code = cmdLines.map(function (l) { return l.replace(/^(\$|>) /, ''); }).join('\n');
      var done = function () { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done);
      else { var t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    });
  });

  /* ---------- OS command tabs: one choice applies to every block, remembered across pages ---------- */
  var OS_LABEL = { mac: 'macOS / Linux', win: 'Windows' };
  var groups = document.querySelectorAll('.os-tabs');
  var setOs = function (os) {
    groups.forEach(function (g) {
      g.querySelectorAll(':scope > .code').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-os') === os); });
      g.querySelectorAll('.os-btn').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-os') === os); });
    });
    try { localStorage.setItem('kd-os', os); } catch (e) {}
  };
  groups.forEach(function (g) {
    var bar = document.createElement('div'); bar.className = 'os-bar';
    g.querySelectorAll(':scope > .code').forEach(function (c) {
      var os = c.getAttribute('data-os'), b = document.createElement('button');
      b.className = 'os-btn'; b.setAttribute('data-os', os); b.textContent = OS_LABEL[os] || os;
      b.addEventListener('click', function () { setOs(os); }); bar.appendChild(b);
    });
    g.insertBefore(bar, g.firstChild);
  });
  if (groups.length) { var savedOs = 'mac'; try { savedOs = localStorage.getItem('kd-os') || 'mac'; } catch (e) {} setOs(savedOs); }

  /* ---------- On-this-page TOC + scroll spy ---------- */
  var toc = document.getElementById('toc');
  var heads = document.querySelectorAll('#content h2[id]');
  if (toc && heads.length) {
    var h = '<div class="toc-head"><h5>On this page</h5><button class="panel-btn toc-close" id="tocClose" title="Hide this panel" aria-label="Hide On this page panel">&raquo;</button></div>';
    heads.forEach(function (x) {
      var label = x.cloneNode(true); var n = label.querySelector('.sec-num'); if (n) n.remove();
      h += '<a href="#' + x.id + '">' + label.textContent.trim() + '</a>';
    });
    toc.innerHTML = h;
    var links = toc.querySelectorAll('a');
    var spy = function () {
      var idx = 0;
      heads.forEach(function (x, i) { if (x.getBoundingClientRect().top < 140) idx = i; });
      links.forEach(function (l, i) { l.classList.toggle('active', i === idx); });
    };
    window.addEventListener('scroll', spy, { passive: true }); spy();
  } else if (toc) { toc.remove(); }

  /* ---------- Progress, back-to-top, mobile nav, filter ---------- */
  var bar = document.getElementById('progress'), top = document.getElementById('toTop');
  window.addEventListener('scroll', function () {
    var d = document.documentElement, p = d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight);
    bar.style.width = (p * 100) + '%'; top.classList.toggle('show', d.scrollTop > 600);
  }, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var B = document.body, save = function (k, open) { try { localStorage.setItem(k, open ? '1' : '0'); } catch (e) {} };
  var toggleSide = function () {
    if (window.innerWidth <= 960) { B.classList.toggle('nav-open'); return; }
    var collapsed = B.classList.toggle('side-collapsed'); save('kd-side', !collapsed);
  };
  document.getElementById('menuBtn').addEventListener('click', toggleSide);
  document.getElementById('sideCollapse').addEventListener('click', toggleSide);
  if (toc && toc.isConnected) {
    B.classList.add('has-toc');
    document.getElementById('tocClose').addEventListener('click', function () { B.classList.add('toc-collapsed'); save('kd-toc', false); });
    document.getElementById('tocOpen').addEventListener('click', function () { B.classList.remove('toc-collapsed'); save('kd-toc', true); });
  }
  document.getElementById('main').addEventListener('click', function () { document.body.classList.remove('nav-open'); });
  var act = document.querySelector('.side-link.active'); if (act) act.scrollIntoView({ block: 'center' });
  var fs = document.getElementById('sideSearch');
  fs.addEventListener('input', function () {
    var q = fs.value.toLowerCase();
    document.querySelectorAll('.side-group').forEach(function (g) {
      var any = false;
      g.querySelectorAll('.side-link').forEach(function (a) { var ok = a.textContent.toLowerCase().indexOf(q) >= 0; a.style.display = ok ? '' : 'none'; any = any || ok; });
      g.style.display = any ? '' : 'none';
    });
  });

  /* ---------- Chapter quiz: reveal answers ---------- */
  document.querySelectorAll('.quiz').forEach(function (qz) {
    var set = function (qi, open) {
      qi.classList.toggle('open', open);
      var b = qi.querySelector('.qbtn'); b.textContent = open ? 'Hide answer' : 'Show answer'; b.setAttribute('aria-expanded', open);
    };
    qz.querySelectorAll('.qi').forEach(function (qi) {
      qi.querySelector('.qbtn').addEventListener('click', function () { set(qi, !qi.classList.contains('open')); });
    });
    var all = qz.querySelector('[data-q="all"]'), none = qz.querySelector('[data-q="none"]');
    var visible = function () { return [].filter.call(qz.querySelectorAll('.qi'), function (qi) { return !qi.classList.contains('qhide'); }); };
    if (all) all.addEventListener('click', function () { visible().forEach(function (qi) { set(qi, true); }); });
    if (none) none.addEventListener('click', function () { qz.querySelectorAll('.qi').forEach(function (qi) { set(qi, false); }); });
  });

  /* ---------- Glossary: underline the first mention of each term, show its definition on hover / tap ---------- */
  (function () {
    var G = window.KD_GLOSSARY || [], root = document.getElementById('content'), tip = document.getElementById('glTip');
    if (!root || !tip || !G.length || document.body.classList.contains('no-glossary')) return;
    var page = location.pathname.split('/').pop() || 'index.html';
    // reference pages (cheat sheet, question bank) are lists of terms — mark only their intro text, not every row/answer
    var SKIP = 'pre, code, a, h1, h2, h3, h4, h5, th, svg, .logviz, .badge, .ptr, .stages, .batches, .cs-chip, .mermaid, .mermaid-fallback, .diagram-body, button, .gl, .qtools, .qbank-filters, .cs-filter, .lv, .chips, .code-head, .pager, .related, .chapter-card, input, .cs-table, .qgroup';
    var accept = function (n) {
      var p = n.parentElement; if (!p || p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim().length > 1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    };
    G.forEach(function (g, i) {
      var re = new RegExp(g.m), w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: accept }), n;
      while ((n = w.nextNode())) {
        var m = re.exec(n.nodeValue); if (!m) continue;
        var after = n.splitText(m.index); after.splitText(m[0].length);
        var s = document.createElement('span');
        s.className = 'gl'; s.tabIndex = 0; s.dataset.g = i; s.textContent = after.nodeValue;
        s.setAttribute('aria-describedby', 'glTip');
        after.parentNode.replaceChild(s, after);
        break; // first mention per page only
      }
    });
    var hideT, cur = null, shownAt = 0;
    var show = function (el) {
      clearTimeout(hideT); var g = G[+el.dataset.g];
      if (cur !== el) shownAt = Date.now();
      cur = el;
      var here = g.f === page;
      tip.innerHTML = '<b>' + g.t + '</b><span>' + g.d + '</span><em>' +
        (here ? 'Explained in this chapter' : '<a href="' + g.f + '">Chapter ' + (g.n < 10 ? '0' : '') + g.n + ' &rarr;</a>') +
        ' &middot; <a href="glossary.html#' + g.id + '">Glossary</a></em>';
      tip.hidden = false;
      var r = el.getBoundingClientRect(), tw = Math.min(320, window.innerWidth - 24);
      tip.style.width = tw + 'px';
      var left = Math.max(12, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 12));
      var top = r.bottom + 8; tip.classList.remove('up');
      if (top + tip.offsetHeight > window.innerHeight - 8) { top = r.top - tip.offsetHeight - 8; tip.classList.add('up'); }
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    };
    var hide = function () { hideT = setTimeout(function () { tip.hidden = true; cur = null; }, 120); };
    root.addEventListener('mouseover', function (e) { var el = e.target.closest('.gl'); if (el) show(el); });
    root.addEventListener('mouseout', function (e) { if (e.target.closest('.gl')) hide(); });
    root.addEventListener('focusin', function (e) { var el = e.target.closest('.gl'); if (el) show(el); });
    root.addEventListener('focusout', function (e) { if (e.target.closest('.gl')) hide(); });
    // touch: a tap fires a synthetic mouseover (opens the tip) just before the click, so a click right after opening keeps it open
    root.addEventListener('click', function (e) {
      var el = e.target.closest('.gl'); if (!el) return; e.preventDefault();
      if (cur === el && !tip.hidden && Date.now() - shownAt > 600) { tip.hidden = true; cur = null; } else show(el);
    });
    tip.addEventListener('mouseover', function () { clearTimeout(hideT); });
    tip.addEventListener('mouseout', hide);
    document.addEventListener('click', function (e) { if (!e.target.closest('.gl') && !e.target.closest('.gl-tip')) { tip.hidden = true; cur = null; } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { tip.hidden = true; cur = null; } });
    window.addEventListener('scroll', function () { if (!tip.hidden) { tip.hidden = true; cur = null; } }, { passive: true });
  })();

  /* ---------- Question bank: part / level / text filters ---------- */
  var qb = document.querySelector('.qbank');
  if (qb) {
    var st = { part: 'all', lv: 'all', q: '' }, qs = qb.querySelectorAll('.qi'), qc = document.getElementById('qbCount'), qsrch = document.getElementById('qbSearch');
    var apply = function () {
      var shown = 0;
      qs.forEach(function (qi) {
        var ok = (st.part === 'all' || qi.dataset.part === st.part) && (st.lv === 'all' || qi.dataset.lv === st.lv) &&
                 (!st.q || qi.textContent.toLowerCase().indexOf(st.q) >= 0);
        qi.classList.toggle('qhide', !ok); if (ok) shown++;
      });
      qb.querySelectorAll('h2[data-part]').forEach(function (h) {
        var g = qb.querySelector('.qgroup[data-part="' + h.dataset.part + '"]');
        var empty = !g.querySelector('.qi:not(.qhide)');
        h.classList.toggle('qhide', empty);
        var tl = document.querySelector('#toc a[href="#' + h.id + '"]'); if (tl) tl.style.display = empty ? 'none' : '';
      });
      qc.textContent = shown === qs.length ? qs.length + ' questions' : shown + ' of ' + qs.length + ' questions';
    };
    var group = function (attr, key) {
      qb.querySelectorAll('[data-' + attr + ']').forEach(function (b) {
        b.addEventListener('click', function () {
          qb.querySelectorAll('[data-' + attr + ']').forEach(function (x) { x.classList.toggle('on', x === b); });
          st[key] = b.getAttribute('data-' + attr); apply();
        });
      });
    };
    group('fpart', 'part'); group('flv', 'lv');
    qsrch.addEventListener('input', function () { st.q = qsrch.value.toLowerCase().trim(); apply(); });
    apply();
  }

  /* ---------- Cheat sheet filter ---------- */
  var cf = document.getElementById('csFilter'), cc = document.getElementById('csCount');
  if (cf) {
    var rows = document.querySelectorAll('.cs-table tbody tr');
    var run = function () {
      var q = cf.value.toLowerCase().trim(), shown = 0;
      rows.forEach(function (r) { var ok = !q || r.textContent.toLowerCase().indexOf(q) >= 0; r.classList.toggle('cs-hide', !ok); if (ok) shown++; });
      document.querySelectorAll('.cs-table').forEach(function (t) {
        var vis = t.querySelectorAll('tbody tr:not(.cs-hide)').length > 0, wrap = t.closest('.table-wrap'), h = wrap.previousElementSibling;
        wrap.classList.toggle('cs-hide', !vis); if (h && h.tagName === 'H2') h.classList.toggle('cs-hide', !vis);
      });
      cc.textContent = q ? shown + ' of ' + rows.length + ' properties match “' + cf.value + '”' : rows.length + ' properties';
    };
    cf.addEventListener('input', run); run();
  }
})();
</script>
</body>
</html>
